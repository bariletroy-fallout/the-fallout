name: Deploy petition patch to Netlify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/petition-netlify-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy petition site
        working-directory: .netlify-petition
        run: >
          npx -y @netlify/mcp@latest
